services:
  postgres:
    image: postgres:16
    container_name: event-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventsuser
      POSTGRES_PASSWORD: eventspass
      POSTGRES_DB: eventsdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: